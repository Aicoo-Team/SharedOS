name: Release npm packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Aicoo-Team/SharedOS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.6.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag and package versions
        shell: bash
        run: |
          package_version="$(node --input-type=module -e 'import manifest from "./packages/sdk/package.json" with { type: "json" }; process.stdout.write(manifest.version)')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - run: pnpm release:publish
        env:
          SHAREDOS_RELEASE_CONFIRM: ${{ github.ref_name }}
