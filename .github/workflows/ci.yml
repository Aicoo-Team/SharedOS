name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.11, 22]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # One build serves the three steps below; the pnpm scripts rebuild for a
      # local run, which CI does not need after an explicit build.
      - run: pnpm build
      - run: node scripts/package-lint.mjs
      - run: pnpm --filter @aicoo/sharedos-example-quickstart start
      - run: node scripts/pack-preview.mjs --check --no-build
